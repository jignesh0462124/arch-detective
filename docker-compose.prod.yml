version: "3.9"

# Production compose — requires .env.production with all required settings
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d

x-api-env: &api-env
  environment:
    ENVIRONMENT: production
    DEBUG: "false"
    DATABASE_URL: ${DATABASE_URL}
    SUPABASE_URL: ${SUPABASE_URL}
    SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
    SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
    SUPABASE_JWT_AUDIENCE: authenticated
    SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    SUPABASE_SCAN_BUCKET: ${SUPABASE_SCAN_BUCKET:-scan-inputs}
    SUPABASE_REPORT_BUCKET: ${SUPABASE_REPORT_BUCKET:-audit-reports}
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    GROQ_API_KEY: ${GROQ_API_KEY}
    GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-70b-versatile}
    NVD_API_KEY: ${NVD_API_KEY:-}
    CORS_ORIGINS: ${CORS_ORIGINS}
    SENTRY_DSN: ${SENTRY_DSN:-}
    LOG_LEVEL: INFO
    LOG_FORMAT: json

services:
  # ── API ───────────────────────────────────────────────────────────────────
  threatlens:
    build:
      context: ./threatlens
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *api-env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # ── Celery worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ./threatlens
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,scans,reports
    restart: unless-stopped
    <<: *api-env
    depends_on:
      redis:
        condition: service_healthy
      threatlens:
        condition: service_healthy

  # ── Celery beat (periodic cleanup) ────────────────────────────────────────
  beat:
    build:
      context: ./threatlens
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: unless-stopped
    <<: *api-env
    depends_on:
      redis:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant ────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"

  # ── Flower (Celery monitoring) ────────────────────────────────────────────
  flower:
    build:
      context: ./threatlens
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app flower --port=5555
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "5555"
    depends_on:
      redis:
        condition: service_healthy

  # ── Nginx (HTTPS reverse proxy + static assets) ───────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro         # Vite build output
      - ./nginx/certs:/etc/ssl:ro               # TLS certs
    depends_on:
      - threatlens

volumes:
  redis_data:
  qdrant_data:
