worker_processes auto;
events { worker_connections 1024; }

http {
    # ── Logging ──────────────────────────────────────────────────────────────
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration":$request_time,'
            '"ip":"$remote_addr",'
            '"x_request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log warn;

    # ── Rate limits ───────────────────────────────────────────────────────────
    # General zone: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Strict zone for auth/scan endpoints: 2 req/s per IP
    limit_req_zone $binary_remote_addr zone=strict:10m rate=2r/s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream api {
        server threatlens:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/ssl/certs/threatlens.crt;
        ssl_certificate_key /etc/ssl/private/threatlens.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options         DENY            always;
        add_header X-Content-Type-Options  nosniff         always;
        add_header Referrer-Policy         strict-origin   always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        client_max_body_size 55M;

        # ── Static assets (Vite build) ────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            limit_req zone=general burst=20 nodelay;
        }

        # ── API proxy ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            limit_req          zone=general burst=20 nodelay;
        }

        # Auth/scan endpoints get stricter rate limiting
        location ~* ^/api/v1/(auth|scans) {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            limit_req          zone=strict burst=5 nodelay;
            limit_req_status   429;
        }

        # ── WebSocket proxy ───────────────────────────────────────────────────
        location /api/v1/ws/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Health check (not rate-limited) ───────────────────────────────────
        location = /health {
            proxy_pass http://api;
            access_log off;
        }
    }
}
