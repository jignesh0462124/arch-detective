x-runtime-environment: &runtime-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
  SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER}
  SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
  SUPABASE_JWT_ALGORITHMS: ${SUPABASE_JWT_ALGORITHMS:-RS256,ES256}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  SUPABASE_SCAN_BUCKET: ${SUPABASE_SCAN_BUCKET:-scan-inputs}
  SUPABASE_REPORT_BUCKET: ${SUPABASE_REPORT_BUCKET:-audit-reports}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
  SOURCE_RETENTION_HOURS: ${SOURCE_RETENTION_HOURS:-24}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-compliance_knowledge}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_HTTPS: "false"
  NVD_API_KEY: ${NVD_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}

services:
  redis:
    image: redis:7-alpine
    container_name: threatlens-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: threatlens-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threatlens-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *runtime-environment
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threatlens-worker
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    environment: *runtime-environment
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.tasks.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    command: ["alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]
    environment:
      <<: *runtime-environment
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}

volumes:
  redis_data:
  qdrant_data:
