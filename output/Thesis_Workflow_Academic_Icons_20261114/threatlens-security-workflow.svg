font-size="26" font-weight="400" fill="#111111">Select ZIP and frameworks</text><text x="84" y="356.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">React / TypeScript interface</text><text x="84" y="392.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Submit an authorised project</text><rect x="650" y="205" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="673" y1="278" x2="1127" y2="278" stroke="#d3cec6"/><text x="674" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">02</text><text x="728" y="250" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Validate and accept</text><g data-stage-icon="02" transform="translate(1090 226)"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="#b23800" viewBox="0 0 256 256" aria-hidden="true"><path d="M208,40H48A16,16,0,0,0,32,56v56c0,52.72,25.52,84.67,46.93,102.19,23.06,18.86,46,25.26,47,25.53a8,8,0,0,0,4.2,0c1-.27,23.91-6.67,47-25.53C198.48,196.67,224,164.72,224,112V56A16,16,0,0,0,208,40Zm0,72c0,37.07-13.66,67.16-40.6,89.42A129.3,129.3,0,0,1,128,223.62a128.25,128.25,0,0,1-38.92-21.81C61.82,179.51,48,149.3,48,112l0-56,160,0ZM82.34,141.66a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32l-56,56a8,8,0,0,1-11.32,0Z"></path></svg></g><text x="674" y="320" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Check identity and membership</text><text x="674" y="356.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Validate archive boundaries</text><text x="674" y="392.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Return a saved scan reference</text><rect x="1240" y="205" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="1263" y1="278" x2="1717" y2="278" stroke="#d3cec6"/><text x="1264" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">03</text><text x="1318" y="250" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Prepare and analyse</text><g data-stage-icon="03" transform="translate(1680 226)"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="#b23800" viewBox="0 0 256 256" aria-hidden="true"><path d="M58.34,101.66l-32-32a8,8,0,0,1,0-11.32l32-32A8,8,0,0,1,69.66,37.66L43.31,64,69.66,90.34a8,8,0,0,1-11.32,11.32Zm40,0a8,8,0,0,0,11.32,0l32-32a8,8,0,0,0,0-11.32l-32-32A8,8,0,0,0,98.34,37.66L124.69,64,98.34,90.34A8,8,0,0,0,98.34,101.66ZM200,40H176a8,8,0,0,0,0,16h24V200H56V136a8,8,0,0,0-16,0v64a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Z"></path></svg></g><text x="1264" y="320" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Prepare redacted source previews</text><text x="1264" y="356.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Run static and model review</text><text x="1264" y="392.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Process independent work concurrently</text><rect x="1240" y="575" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="1263" y1="648" x2="1717" y2="648" stroke="#d3cec6"/><text x="1264" y="620" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">04</text><text x="1318" y="620" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Ground and persist</text><g data-stage-icon="04" transform="translate(1680 596)"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="#b23800" viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24C74.17,24,32,48.6,32,80v96c0,31.4,42.17,56,96,56s96-24.6,96-56V80C2