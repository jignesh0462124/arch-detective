1,1,20,20A20,20,0,0,1,104,148Z"></path></svg></g><text x="674" y="690" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Inspect source and finding details</text><text x="674" y="726.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Use the graph for associations</text><text x="674" y="762.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Review suggested remedies</text><rect x="60" y="575" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="83" y1="648" x2="537" y2="648" stroke="#d3cec6"/><text x="84" y="620" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">06</text><text x="138" y="620" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Report export</text><g data-stage-icon="06" transform="translate(500 596)"><svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="#b23800" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,82.34l-56-56A8,8,0,0,0,152,24H56A16,16,0,0,0,40,40V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V88A8,8,0,0,0,213.66,82.34ZM160,51.31,188.69,80H160ZM200,216H56V40h88V88a8,8,0,0,0,8,8h48V216Zm-42.34-61.66a8,8,0,0,1,0,11.32l-24,24a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L120,164.69V120a8,8,0,0,1,16,0v44.69l10.34-10.35A8,8,0,0,1,157.66,154.34Z"></path></svg></g><text x="84" y="690" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Read saved assessment data</text><text x="84" y="726.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Render with Chromium / fallback</text><text x="84" y="762.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Download the generated PDF</text><polyline points="560,320 650,320" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1150,320 1240,320" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1490,435 1490,575" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1240,690 1150,690" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="650,690 560,690" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><text x="60" y="867" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#111111">Supporting services</text><text x="60" y="911" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#626260">Supabase Auth  ·  PostgreSQL with workspace policies  ·  Private source storage  ·  Configured model provider</text><rect x="60" y="965" width="1680" height="215" rx="3" fill="white" stroke="#b23800" stroke-width="2" stroke-dasharray="9 7"/><text x="84" y="1008" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#b23800">Separate optional worker and retrieval profile</text><text x="84" y="1055" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#111111">Celery / Redis → Semgrep → Bandit → TruffleHog → dependency audit → model review</text><text x="84" y="1096" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#111111">Deduplicate → CVSS and candidate control mapping → persist results</text><text x="84" y="1141" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#626260">Retrieval support: versioned reference corpus → embeddings / Qdrant → candidate controls</text><text x="60" y="1241" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626260">Dashed enclosure denotes an optional deployment. Findings and suggested mappings require human review.</text></svg>