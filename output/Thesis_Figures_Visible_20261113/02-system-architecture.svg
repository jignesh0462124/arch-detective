<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1570" viewBox="0 0 1900 1570"><rect width="100%" height="100%" fill="white"/><text x="70" y="55" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#202020">Overall ThreatLens System Architecture</text><text x="70" y="117" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#515151">Core saved-ZIP Audit Workbench path  |  displayed application name: Archon</text><rect x="70" y="195" width="1760" height="170" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="92" y="219" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Web application</text><text x="92" y="271" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">React and TypeScript  |  project upload, findings, evidence graph, Security Advisor and reports</text><text x="92" y="306" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Monaco provides the read-only source viewer. Authenticated requests carry the current user session.</text><polyline points="950,365 950,465" fill="none" stroke="#777777" stroke-width="2"/><polygon points="950,465 944.345448056554,453.2941876694152 955.654551943446,453.2941876694152" fill="#777777"/><text x="985" y="394" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#202020">HTTPS / authenticated API requests</text><rect x="70" y="465" width="1760" height="170" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="92" y="489" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">FastAPI and workspace authorization</text><text x="92" y="541" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">JWT verification and current membership checks  |  bounded archive validation and scan acceptance</text><text x="92" y="576" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">In-process audit orchestration, progress/status endpoints, source reads and on-demand report access</text><polyline points="345,635 345,745" fill="none" stroke="#777777" stroke-width="2"/><polygon points="345,745 339.345448056554,733.2941876694152 350.654551943446,733.2941876694152" fill="#777777"/><polyline points="950,635 950,745" fill="none" stroke="#777777" stroke-width="2"/><polygon points="950,745 944.345448056554,733.2941876694152 955.654551943446,733.2941876694152" fill="#777777"/><polyline points="1555,635 1555,745" fill="none" stroke="#777777" stroke-width="2"/><polygon points="1555,745 1549.345448056554,733.2941876694152 1560.654551943446,733.2941876694152" fill="#777777"/><rect x="70" y="745" width="550" height="235" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="92" y="769" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Source preparation</text><text x="92" y="809" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">and private previews</text><text x="92" y="861" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Build the file manifest</text><text x="92" y="896" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Redact and upload text previews</text><text x="92" y="931" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Publish available file windows</text><rect x="675" y="745" width="550" height="235" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="697" y="769" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Static and model-assisted</text><text x="697" y="809" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">security analysis</text><text x="697" y="861" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Run independent reviews in parallel</text><text x="697" y="896" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Merge and ground reported findings</text><text x="697" y="931" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Save evidence and control mappings</text><rect x="1280" y="745" width="550" height="235" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="1302" y="769" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Report and Advisor</text><text x="1302" y="809" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">services</text><text x="1302" y="861" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Render saved audit content as PDF</text><text x="1302" y="896" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Load authorised finding context</text><text x="1302" y="931" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Keep suggestions separate from source</text><rect x="350" y="670" width="1020" height="42" rx="0" fill="white" stroke="white" stroke-width="1.2"/><text x="360" y="681" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#202020">Source preparation and analysis proceed concurrently.</text><polyline points="345,980 345,1125" fill="none" stroke="#777777" stroke-width="2"/><polygon points="345,1125 339.345448056554,1113.2941876694151 350.654551943446,1113.2941876694151" fill="#777777"/><polyline points="950,980 950,1125" fill="none" stroke="#777777" stroke-width="2"/><polygon points="950,1125 944.345448056554,1113.2941876694151 955.654551943446,1113.2941876694151" fill="#777777"/><polyline points="1555,980 1555,1125" fill="none" stroke="#777777" stroke-width="2"/><polygon points="1555,1125 1549.345448056554,1113.2941876694151 1560.654551943446,1113.2941876694151" fill="#777777"/><polyline points="1160,980 1160,1060 1440,1060 1440,1125" fill="none" stroke="#777777" stroke-width="2"/><polygon points="1440,1125 1434.345448056554,1113.2941876694151 1445.654551943446,1113.2941876694151" fill="#777777"/><text x="1180" y="1027" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#515151">Model review</text><rect x="70" y="1125" width="550" height="235" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="92" y="1149" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Private source storage</text><text x="92" y="1201" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Supabase private Storage objects</text><text x="92" y="1236" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">30-day source-preview window</text><text x="92" y="1271" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Expiry and durable cleanup</text><rect x="675" y="1125" width="550" height="235" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="697" y="1149" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Audit metadata and results</text><text x="697" y="1201" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">PostgreSQL with scoped RLS</text><text x="697" y="1236" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Scans, findings and source locations</text><text x="697" y="1271" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Jobs, mappings and private chats</text><rect x="1280" y="1125" width="550" height="235" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="1302" y="1149" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Configured model providers</text><text x="1302" y="1201" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Server-side credentials only</text><text x="1302" y="1236" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Bounded, redacted source context</text><text x="1302" y="1271" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Existing provider fallback</text><text x="70" y="1430" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#202020">Identity: Supabase Auth supplies sessions; the API verifies tokens and enforces workspace access.</text><text x="70" y="1474" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#202020">Progressive opening is capability-gated. A scan is complete only after its results are saved.</text><text x="70" y="1518" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#515151">Optional GitHub and separate worker/retrieval paths are omitted; they are not required for this ZIP path.</text></svg>