<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1110" viewBox="0 0 1800 1110"><rect width="100%" height="100%" fill="white"/><text x="70" y="55" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#202020">Research and Development Workflow</text><text x="70" y="117" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#515151">ThreatLens  |  engineering study and verification process</text><rect x="70" y="205" width="470" height="275" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="92" y="229" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#C44A15">01</text><text x="92" y="268" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Define the problem</text><text x="92" y="308" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">and study boundaries</text><text x="92" y="360" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Developer review needs</text><text x="92" y="395" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Evidence, access and privacy</text><rect x="665" y="205" width="470" height="275" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="687" y="229" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#C44A15">02</text><text x="687" y="268" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Review guidance</text><text x="687" y="308" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">and requirements</text><text x="687" y="360" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Security checks and mappings</text><text x="687" y="395" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Roles and retention limits</text><rect x="1260" y="205" width="470" height="275" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="1282" y="229" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#C44A15">03</text><text x="1282" y="268" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Design architecture</text><text x="1282" y="308" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">and the data model</text><text x="1282" y="360" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Browser, API and persistence</text><text x="1282" y="395" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Scan and finding relationships</text><rect x="1260" y="640" width="470" height="275" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="1282" y="664" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#C44A15">04</text><text x="1282" y="703" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Implement scanning</text><text x="1282" y="743" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">and evidence review</text><text x="1282" y="795" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Parallel source preparation</text><text x="1282" y="830" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Read-only review workbench</text><rect x="665" y="640" width="470" height="275" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="687" y="664" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#C44A15">05</text><text x="687" y="703" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Verify behaviour</text><text x="687" y="743" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">with recorded tests</text><text x="687" y="795" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Archive and access checks</text><text x="687" y="830" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Interface, evidence and reports</text><rect x="70" y="640" width="470" height="275" rx="10" fill="#F6F5F2" stroke="#777777" stroke-width="1.2"/><text x="92" y="664" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#C44A15">06</text><text x="92" y="703" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">Discuss findings</text><text x="92" y="743" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#202020">and document limits</text><text x="92" y="795" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Timing and evidence consistency</text><text x="92" y="830" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#515151">Separate verification from claims</text><polyline points="540,343 665,343" fill="none" stroke="#777777" stroke-width="2"/><polygon points="665,343 653.2941876694152,348.654551943446 653.2941876694152,337.345448056554" fill="#777777"/><polyline points="1135,343 1260,343" fill="none" stroke="#777777" stroke-width="2"/><polygon points="1260,343 1248.2941876694151,348.654551943446 1248.2941876694151,337.345448056554" fill="#777777"/><polyline points="1495,480 1495,640" fill="none" stroke="#777777" stroke-width="2"/><polygon points="1495,640 1489.345448056554,628.2941876694152 1500.654551943446,628.2941876694152" fill="#777777"/><polyline points="1260,778 1135,778" fill="none" stroke="#777777" stroke-width="2"/><polygon points="1135,778 1146.7058123305849,772.345448056554 1146.7058123305849,783.654551943446" fill="#777777"/><polyline points="665,778 540,778" fill="none" stroke="#777777" stroke-width="2"/><polygon points="540,778 551.7058123305848,772.345448056554 551.7058123305848,783.654551943446" fill="#777777"/><text x="70" y="1000" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202020">Outputs: working prototype, traceable test evidence and thesis documentation.</text><text x="70" y="1050" dominant-baseline="text-before-edge" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#515151">This development workflow does not establish independently measured detection accuracy.</text></svg>