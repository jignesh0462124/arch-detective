<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>Local and Optional Worker Processing Modes</title><desc>Code-grounded comparison of orchestration — not a live deployment or performance result</desc><defs><marker id="main" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#111111"/></marker><marker id="optional" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#b23800"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="78" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#111111">Local and Optional Worker Processing Modes</text><text x="60" y="130" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#626260">Code-grounded comparison of orchestration — not a live deployment or performance result</text><text x="60" y="210" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#111111">LOCAL PROGRESSIVE WORKBENCH</text><rect x="60" y="255" width="365" height="200" rx="8" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2" /><text x="82" y="300" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#111111">FastAPI scan</text><text x="82" y="350" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Validate project input</text><text x="82" y="382.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Accept scan reference</text><rect x="495" y="255" width="365" height="200" rx="8" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2" /><text x="517" y="300" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#111111">Concurrent work</text><text x="517" y="350" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Source preparation</text><text x="517" y="382.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Static + model review</text><rect x="930" y="255" width="365" height="200" rx="8" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2" /><text x="952" y="300" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#111111">Ground and save</text><text x="952" y="350" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Resolve source locations</text><text x="952" y="382.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Persist findings / status</text><rect x="1365" y="255" width="365" height="200" rx="8" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2" /><text x="1387" y="300" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#111111">Review interfaces</text><text x="1387" y="350" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Read-only workbench</text><text x="1387" y="382.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">On-demand report export</text><polyline points="425,355 495,355" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#main)" /><polyline points="860,355 930,355" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#main)" /><polyline points="1295,355 1365,355" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#main)" /><text x="60" y="540" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#b23800">OPTIONAL FULL SCANNER-WORKER PROFILE</text><rect x="60" y="585" width="365" height="220" rx="8" fill="#fff3e8" stroke="#b23800" stroke-width="2" stroke-dasharray="10 7"/><text x="82" y="630" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#b23800">Celery / Redis</text><text x="82" y="680" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Queue and claim job</text><text x="82" y="712.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Retrieve source artifact</text><rect x="495" y="585" width="365" height="220" rx="8" fill="#fff3e8" stroke="#b23800" stroke-width="2" stroke-dasharray="10 7"/><text x="517" y="630" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#b23800">Specialist checks</text><text x="517" y="680" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Semgrep → Bandit</text><text x="517" y="712.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">→ TruffleHog</text><text x="517" y="745" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Sequential worker calls</text><rect x="930" y="585" width="365" height="220" rx="8" fill="#fff3e8" stroke="#b23800" stroke-width="2" stroke-dasharray="10 7"/><text x="952" y="630" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#b23800">Additional review</text><text x="952" y="680" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Dependency auditing</text><text x="952" y="712.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">→ model code review</text><text x="952" y="745" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">→ deduplicate / save</text><rect x="1365" y="585" width="365" height="220" rx="8" fill="#fff3e8" stroke="#b23800" stroke-width="2" stroke-dasharray="10 7"/><text x="1387" y="630" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#b23800">Enrichment</text><text x="1387" y="680" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">CVSS / control mapping</text><text x="1387" y="712.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Persist assessment</text><text x="1387" y="745" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Separate report task</text><polyline points="425,695 495,695" fill="none" stroke="#b23800" stroke-width="3" marker-end="url(#optional)" stroke-dasharray="10 7"/><polyline points="860,695 930,695" fill="none" stroke="#b23800" stroke-width="3" marker-end="url(#optional)" stroke-dasharray="10 7"/><polyline points="1295,695 1365,695" fill="none" stroke="#b23800" stroke-width="3" marker-end="url(#optional)" stroke-dasharray="10 7"/><rect x="495" y="885" width="800" height="120" rx="8" fill="#fff3e8" stroke="#b23800" stroke-width="2" stroke-dasharray="10 7"/><text x="517" y="930" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#b23800">Optional retrieval support</text><text x="517" y="980" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#111111">Versioned corpus → embeddings / Qdrant → candidate controls</text><polyline points="1295,945 1550,945 1550,805" fill="none" stroke="#b23800" stroke-width="3" marker-end="url(#optional)" stroke-dasharray="10 7"/><text x="60" y="1060" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626260">The worker is not shown as parallel. Infrastructure/log coverage is not implied by accepting a file.</text></svg>