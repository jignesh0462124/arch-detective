<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img"><title>ThreatLens Security Analysis Workflow</title><desc>Print-first workflow diagram for the core saved-ZIP path, with a separately labelled optional worker and retrieval profile.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#111111"/></marker></defs><rect width="1800" height="1280" fill="white"/><text x="60" y="74" font-family="Georgia,Times New Roman,serif" font-size="45" font-weight="700" fill="#111111">ThreatLens Security Analysis Workflow</text><text x="60" y="124" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#626260">Core project-ZIP workflow</text><line x1="60" y1="154" x2="1740" y2="154" stroke="#d3cec6" stroke-width="2"/><rect x="60" y="205" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="83" y1="278" x2="537" y2="278" stroke="#d3cec6"/><text x="84" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">01</text><text x="138" y="250" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Project intake</text><text x="84" y="320" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Select ZIP and frameworks</text><text x="84" y="356.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">React / TypeScript interface</text><text x="84" y="392.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Submit an authorised project</text><rect x="650" y="205" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="673" y1="278" x2="1127" y2="278" stroke="#d3cec6"/><text x="674" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">02</text><text x="728" y="250" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Validate and accept</text><text x="674" y="320" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Check identity and membership</text><text x="674" y="356.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Validate archive boundaries</text><text x="674" y="392.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Return a saved scan reference</text><rect x="1240" y="205" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="1263" y1="278" x2="1717" y2="278" stroke="#d3cec6"/><text x="1264" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">03</text><text x="1318" y="250" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Prepare and analyse</text><text x="1264" y="320" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Prepare redacted source previews</text><text x="1264" y="356.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Run static and model review</text><text x="1264" y="392.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Process independent work concurrently</text><rect x="1240" y="575" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="1263" y1="648" x2="1717" y2="648" stroke="#d3cec6"/><text x="1264" y="620" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">04</text><text x="1318" y="620" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Ground and persist</text><text x="1264" y="690" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Check source-linked locations</text><text x="1264" y="726.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Merge and save reported findings</text><text x="1264" y="762.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Mark complete after persistence</text><rect x="650" y="575" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="673" y1="648" x2="1127" y2="648" stroke="#d3cec6"/><text x="674" y="620" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">05</text><text x="728" y="620" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Evidence review</text><text x="674" y="690" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Inspect source and finding details</text><text x="674" y="726.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Use the graph for associations</text><text x="674" y="762.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Review suggested remedies</text><rect x="60" y="575" width="500" height="230" rx="3" fill="#f5f1ec" stroke="#d3cec6" stroke-width="2"/><line x1="83" y1="648" x2="537" y2="648" stroke="#d3cec6"/><text x="84" y="620" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#b23800">06</text><text x="138" y="620" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#111111">Report export</text><text x="84" y="690" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Read saved assessment data</text><text x="84" y="726.4" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Render with Chromium / fallback</text><text x="84" y="762.8" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#111111">Download the generated PDF</text><polyline points="560,320 650,320" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1150,320 1240,320" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1490,435 1490,575" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1240,690 1150,690" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="650,690 560,690" fill="none" stroke="#111111" stroke-width="2.5" marker-end="url(#arrow)" /><text x="60" y="867" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#111111">Supporting services</text><text x="60" y="911" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#626260">Supabase Auth  ·  PostgreSQL with workspace policies  ·  Private source storage  ·  Configured model provider</text><rect x="60" y="965" width="1680" height="215" rx="3" fill="white" stroke="#b23800" stroke-width="2" stroke-dasharray="9 7"/><text x="84" y="1008" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#b23800">Separate optional worker and retrieval profile</text><text x="84" y="1055" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#111111">Celery / Redis → Semgrep → Bandit → TruffleHog → dependency audit → model review</text><text x="84" y="1096" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#111111">Deduplicate → CVSS and candidate control mapping → persist results</text><text x="84" y="1141" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#626260">Retrieval support: versioned reference corpus → embeddings / Qdrant → candidate controls</text><text x="60" y="1241" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#626260">Dashed enclosure denotes an optional deployment. Findings and suggested mappings require human review.</text></svg>