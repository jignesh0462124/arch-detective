<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1310" viewBox="0 0 1800 1310" role="img"><title>ThreatLens System Architecture</title><desc>Core saved-ZIP path; optional deployment modes are shown separately</desc><defs><marker id="main" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#173851"/></marker><marker id="optional" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#135e61"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="78" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#173851">ThreatLens System Architecture</text><text x="60" y="130" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#475662">Core saved-ZIP path; optional deployment modes are shown separately</text><rect x="60" y="215" width="480" height="175" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="82" y="260" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">Web application</text><text x="82" y="310" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">React / TypeScript / source viewer</text><text x="82" y="342.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Upload, review and report access</text><rect x="660" y="215" width="480" height="175" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="682" y="260" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">Authenticated FastAPI</text><text x="682" y="310" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Validate identity and membership</text><text x="682" y="342.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Accept bounded project uploads</text><rect x="1260" y="215" width="480" height="175" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="1282" y="260" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">Identity verification</text><text x="1282" y="310" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Supabase Auth / signing keys</text><text x="1282" y="342.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Validated session identity</text><polyline points="540,302 660,302" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polyline points="1140,302 1260,302" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><rect x="60" y="535" width="480" height="215" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="82" y="580" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">Source preparation</text><text x="82" y="630" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Manifest and redacted previews</text><text x="82" y="662.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Private Storage objects</text><text x="82" y="695" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Time-limited source access</text><rect x="660" y="495" width="480" height="295" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="682" y="540" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">In-process assessment</text><text x="682" y="590" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Static rules + model review</text><text x="682" y="622.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Run independently / merge results</text><text x="682" y="655" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Ground locations in source</text><text x="682" y="687.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Retain coverage limitations</text><rect x="1260" y="535" width="480" height="215" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="1282" y="580" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#173851">Configured model provider</text><text x="1282" y="630" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Bounded, redacted context</text><text x="1282" y="662.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Provider and model are configurable</text><text x="1282" y="695" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">No fixed model-name assumption</text><polyline points="900,390 900,495" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polyline points="660,640 540,640" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polyline points="1140,640 1260,640" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><rect x="660" y="915" width="480" height="185" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="682" y="960" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">Saved assessment data</text><text x="682" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">PostgreSQL / workspace-scoped RLS</text><text x="682" y="1042.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Findings, locations and metadata</text><rect x="60" y="915" width="480" height="185" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="82" y="960" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">Evidence review</text><text x="82" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Workbench, Findings and graph</text><text x="82" y="1042.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Suggestions require human review</text><rect x="1260" y="915" width="480" height="185" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="1282" y="960" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#173851">On-demand reports</text><text x="1282" y="1010" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Saved data → renderer → PDF</text><text x="1282" y="1042.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">No new scan during PDF export</text><polyline points="900,790 900,915" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polyline points="660,1007 540,1007" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polyline points="1140,1007 1260,1007" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><text x="60" y="1180" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#475662">Reports: Chromium or available fallback renders the document before download.</text><text x="60" y="1230" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#135e61">Separate optional worker / retrieval profile: Celery, Redis, specialist scanners and Qdrant.</text></svg>