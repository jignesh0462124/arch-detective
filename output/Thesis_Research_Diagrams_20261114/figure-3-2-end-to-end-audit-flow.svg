<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510" role="img"><title>ThreatLens End-to-End Audit Flow</title><desc>Accepted project-ZIP workflow — source preparation and analysis have separate states</desc><defs><marker id="main" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#173851"/></marker><marker id="optional" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#135e61"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="78" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#173851">ThreatLens End-to-End Audit Flow</text><text x="60" y="130" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#475662">Accepted project-ZIP workflow — source preparation and analysis have separate states</text><rect x="570" y="190" width="660" height="125" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="592" y="235" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#173851">Select project ZIP and frameworks</text><polyline points="900,315 900,345" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polygon points="900,345 1090,420 900,495 710,420" fill="#edf6f4" stroke="#135e61" stroke-width="2"/><text x="790" y="429" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#135e61">Input valid?</text><rect x="1280" y="350" width="455" height="155" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="1302" y="395" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#173851">Reject before acceptance</text><text x="1302" y="445" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Explain validation or access error</text><text x="1302" y="477.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">No completed audit is implied</text><polyline points="1090,420 1280,420" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><text x="1150" y="400" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17232e">No</text><polyline points="900,495 900,535" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><text x="925" y="525" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17232e">Yes</text><rect x="570" y="535" width="660" height="130" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="592" y="580" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#173851">Accept scan and return its ID</text><text x="592" y="630" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Open progressive workbench when enabled</text><polyline points="900,665 900,710 405,710 405,755" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polyline points="900,710 1395,710 1395,755" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><rect x="70" y="755" width="670" height="225" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="92" y="800" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#173851">Prepare source previews</text><text x="92" y="850" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Publish manifest / pending file states</text><text x="92" y="882.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Upload redacted source; expose ready files</text><text x="92" y="915" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Preview failure remains explicit</text><rect x="1060" y="755" width="670" height="225" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="1082" y="800" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#173851">Analyse eligible source</text><text x="1082" y="850" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Static rules and model review overlap</text><text x="1082" y="882.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Ground and merge reported findings</text><text x="1082" y="915" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Record exclusions and limitations</text><text x="770" y="835" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#135e61">Concurrent</text><text x="770" y="870.1" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#135e61">operations</text><polyline points="405,980 405,1040 900,1040 900,1080" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><polyline points="1395,980 1395,1040 900,1040" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><rect x="570" y="1080" width="660" height="170" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="592" y="1125" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#173851">Persist results and final status</text><text x="592" y="1175" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Only saved results can be marked complete</text><text x="592" y="1207.5" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#17232e">Retain findings if source previews fail</text><polyline points="900,1250 900,1300" fill="none" stroke="#173851" stroke-width="3" marker-end="url(#main)" /><rect x="570" y="1300" width="660" height="125" rx="8" fill="#eaf1f6" stroke="#70818d" stroke-width="2" /><text x="592" y="1345" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#173851">Review evidence and export reports</text><text x="70" y="1470" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#475662">Failed processing or persistence remains failed; an unfinished audit must never appear clean.</text></svg>