<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>Complementary Security-Review Approaches</title><desc>Method classification — not a product ranking or accuracy comparison</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#505b63"/></marker></defs><rect width="1800" height="1080" fill="white"/><text x="70" y="88" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#20262b">Complementary Security-Review Approaches</text><text x="70" y="140" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#505b63">Method classification — not a product ranking or accuracy comparison</text><rect x="70" y="210" width="560" height="180" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="94" y="255" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#20262b">Static analysis</text><text x="94" y="305" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Recognised patterns and data flow</text><text x="94" y="338" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Context and language limits remain</text><polyline points="630,300 665,300 665,560 700,560" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><rect x="1170" y="210" width="560" height="180" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="1194" y="255" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#20262b">Dependency analysis</text><text x="1194" y="305" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Package names and versions</text><text x="1194" y="338" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Version evidence is required</text><polyline points="1170,300 1135,300 1135,560 1100,560" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><rect x="70" y="450" width="560" height="180" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="94" y="495" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#20262b">Secret detection</text><text x="94" y="545" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Potential credentials in source</text><text x="94" y="578" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Placeholders require interpretation</text><polyline points="630,540 665,540 665,560 700,560" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><rect x="1170" y="450" width="560" height="180" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="1194" y="495" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#20262b">Configuration review</text><text x="1194" y="545" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Deployment and application settings</text><text x="1194" y="578" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Runtime settings may be unavailable</text><polyline points="1170,540 1135,540 1135,560 1100,560" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><rect x="70" y="690" width="560" height="180" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="94" y="735" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#20262b">Model-assisted explanation</text><text x="94" y="785" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Bounded context and suggestions</text><text x="94" y="818" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Check assumptions against evidence</text><polyline points="630,780 665,780 665,560 700,560" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><rect x="1170" y="690" width="560" height="180" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="1194" y="735" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#20262b">Human review</text><text x="1194" y="785" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Application knowledge and judgement</text><text x="1194" y="818" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#505b63">Confirm relevance and next steps</text><polyline points="1170,780 1135,780 1135,560 1100,560" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><rect x="700" y="435" width="400" height="250" rx="10" fill="#eee7db" stroke="#818b92" stroke-width="2" /><text x="730" y="495" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#20262b">Evidence review</text><text x="730" y="550" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" fill="#20262b">Inspect source</text><text x="730" y="588.28" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" fill="#20262b">Check uncertainty</text><text x="730" y="626.56" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" fill="#20262b">Decide next steps</text><text x="70" y="1015" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="400" fill="#505b63">Each method supplies a different kind of evidence; none alone guarantees security.</text></svg>