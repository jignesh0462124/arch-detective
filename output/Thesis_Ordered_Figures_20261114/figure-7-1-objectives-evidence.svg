xt><rect x="60" y="470" width="1680" height="155" rx="10" fill="#f7f6f3" stroke="#818b92" stroke-width="2" /><text x="90" y="530" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#20262b">Retained audit access</text><text x="590" y="530" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">Saved-scan history design</text><text x="1140" y="530" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">Reload, navigation, expiry</text><text x="1140" y="565.64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">and deletion tests</text><rect x="60" y="625" width="1680" height="155" rx="10" fill="#ffffff" stroke="#818b92" stroke-width="2" /><text x="90" y="685" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#20262b">Readable report output</text><text x="590" y="685" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">Generated PDF excerpt</text><text x="1140" y="685" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">Content parity and complete</text><text x="1140" y="720.64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">multi-page rendering</text><rect x="60" y="780" width="1680" height="155" rx="10" fill="#f7f6f3" stroke="#818b92" stroke-width="2" /><text x="90" y="840" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#20262b">Private workspace access</text><text x="590" y="840" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">Authorisation / policy design</text><text x="1140" y="840" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b">Permitted and denied reads</text><text x="1140" y="875.64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#20262b"