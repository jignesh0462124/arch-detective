<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img"><title>Future Research and Development Roadmap</title><desc>Proposed future work — no completion dates or performance claims</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#505b63"/></marker></defs><rect width="1800" height="1080" fill="white"/><text x="70" y="88" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#20262b">Future Research and Development Roadmap</text><text x="70" y="140" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="#505b63">Proposed future work — no completion dates or performance claims</text><rect x="70" y="225" width="750" height="310" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="98" y="271" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#a74419">01</text><text x="98" y="320" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">Reconcile evidence</text><text x="98" y="364.88" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">and datasets</text><text x="98" y="425" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Label test projects</text><text x="98" y="460.64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Define matching rules</text><text x="98" y="496.28" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Archive repeatable run records</text><rect x="980" y="225" width="750" height="310" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="1008" y="271" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#a74419">02</text><text x="1008" y="320" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">Extend and evaluate</text><text x="1008" y="364.88" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">analysis</text><text x="1008" y="425" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Broaden language coverage</text><text x="1008" y="460.64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Evaluate prompts and retrieval</text><text x="1008" y="496.28" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Measure false alarms and misses</text><rect x="980" y="640" width="750" height="310" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="1008" y="686" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#a74419">03</text><text x="1008" y="735" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">Validate deployment</text><text x="1008" y="779.88" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">and automation</text><text x="1008" y="840" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Test isolation and recovery</text><text x="1008" y="875.64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Review repository permissions</text><text x="1008" y="911.28" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Measure realistic concurrent load</text><rect x="70" y="640" width="750" height="310" rx="10" fill="#f6f4ef" stroke="#818b92" stroke-width="2" /><text x="98" y="686" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#a74419">04</text><text x="98" y="735" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">Study developer</text><text x="98" y="779.88" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#20262b">outcomes</text><text x="98" y="840" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Measure evidence-review time</text><text x="98" y="875.64" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Assess remediation decisions</text><text x="98" y="911.28" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#505b63">Collect consented usability feedback</text><polyline points="820,380 980,380" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><polyline points="1355,535 1355,640" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><polyline points="980,795 820,795" fill="none" stroke="#505b63" stroke-width="3" marker-end="url(#arrow)" /><text x="70" y="1020" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="#505b63">Maintain human review, source privacy and explicit coverage limitations at every stage.</text></svg>